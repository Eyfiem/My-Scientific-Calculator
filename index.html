<title>CW-991 Calculator Pro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:#0f1114;display:flex;justify-content:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  user-select:none;-webkit-user-select:none;--kh:clamp(40px,calc((100dvh - 372px)/7),56px)}
#body{width:100%;max-width:440px;min-height:100%;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  background:linear-gradient(180deg,#2d3138,#1b1e23);display:flex;flex-direction:column;gap:10px}
#lcd{position:relative;background:#f3f5f1;color:#12161a;border-radius:8px;border:4px solid #08090b;height:158px;padding:4px 10px 8px;
  display:flex;flex-direction:column;box-shadow:inset 0 0 0 1px #c9cec6}
#st{display:flex;gap:8px;font-size:.62rem;font-weight:700;height:.95rem;align-items:center;border-bottom:1px solid #d5d9d1;color:#9aa19a}

@keyframes bl{50%{opacity:0}}

#rs.err{font-size:1.2rem;color:#a02214;padding-top:.7rem}
#opt{position:absolute;inset:0;background:#f3f5f1;z-index:3;padding:6px;overflow-y:auto;display:grid;grid-template-columns:1fr 1fr;gap:5px;align-content:start}
#opt[hidden]{display:none}
#opt button{background:#dfe4da;color:#12161a;border:1px solid #b9c0b3;border-radius:5px;font:inherit;font-size:.9rem;padding:7px}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.col{display:flex;flex-direction:column;gap:8px;width:30%}
.pad{position:relative;width:104px;height:104px;border-radius:50%;background:#0d0f12;box-shadow:inset 0 0 0 3px #3a3f47}
.pad button{position:absolute;width:38px;height:34px;background:transparent;border:0;color:#cfd4da;font-size:1.1rem;box-shadow:none;padding:0}
.pad .u{top:4px;left:33px}.pad .d{bottom:4px;left:33px}.pad .l{left:4px;top:35px}.pad .r{right:4px;top:35px}
.pad::after{content:"";position:absolute;left:34px;top:34px;width:36px;height:36px;border-radius:50%;background:#1c1f24;box-shadow:inset 0 0 0 2px #2a2e34}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px 6px}
.grid+.grid{margin-top:6px}
button{font:inherit;color:#fff;border:0;cursor:pointer;touch-action:manipulation;padding:0}
.k{height:var(--kh);border-radius:9px;background:#3a3f47;box-shadow:0 2px 0 #0b0c0e;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;padding:0 0 3px}
.k:active,.pad button:active{filter:brightness(1.35);transform:translateY(1px)}
.k:focus-visible{outline:2px solid #7fb4ff;outline-offset:2px}
.k .t{display:flex;justify-content:space-between;font-size:.58rem;font-weight:600;padding:0 4px;height:.85rem;line-height:.85rem}
.k .s{color:#f2c230;border-radius:3px;padding:0 2px}.k .a{color:#f07b7b;border-radius:3px;padding:0 2px}
.k .m{font-size:.98rem;text-align:center;line-height:1.1}
.n{background:#d9dbde;color:#14171a;box-shadow:0 2px 0 #7d8186}.n .m{font-size:1.2rem;font-weight:600}.n .s{color:#a97c00}.n .a{color:#b23a3a}
.o{background:#4a4f58}.o .m{font-size:1.15rem}
.x{background:#c8742b}.x .m{font-weight:700}
.e{background:#2d6cd0}.e .m{font-size:1.3rem;font-weight:700}
.top .k{height:calc(var(--kh)*.82);justify-content:center;padding:0}
.top .k .m{font-size:.8rem;font-weight:700}
.sk .m{color:#f2c230}.ak .m{color:#f07b7b}
.sh .k .s{background:#f2c230;color:#111}.al .k .a{background:#f07b7b;color:#111}
sup{font-size:.62em;line-height:0}
@media (prefers-reduced-motion:reduce){.cur{animation:none}.k:active{transform:none}}
#md{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:flex;align-items:center;justify-content:center;padding:14px}
#md[hidden]{display:none}
.mc{background:#262a31;color:#e8eaed;border-radius:12px;padding:14px;width:100%;max-width:400px;max-height:88dvh;overflow-y:auto}
.mc h3{margin:0 0 8px;font-size:1rem}
.mc label{display:block;font-size:.75rem;color:#9aa1ab;margin:8px 0 3px}
.mc input{width:100%;background:#12151a;color:#eee;border:1px solid #444a54;border-radius:6px;padding:8px;font:inherit;font-size:.95rem}
.mc button{width:100%;border-radius:8px;padding:10px;margin-top:8px;font-weight:600;background:#3a3f47}
.mc .go{background:#2d6cd0}.mc .cl{background:#6b2a2a}.mc .sel{background:#c8742b}
.row,.r3{display:flex;gap:6px}.row button{margin-top:4px}.r3 label{flex:1}
.mc table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.85rem}
.mc td{border-bottom:1px solid #3d424b;padding:5px 6px}.mc td:first-child{color:#8ab4ff;width:40%}
</style>

<body>
<div id="body">
  <div id="lcd">
    <div id="st"><span id="sS">S</span><span id="sA">A</span><span id="sH">HYP</span><span class="sp"></span><span id="sU" class="on">Deg</span><span class="on">Math</span></div>
    <div id="ex"></div>
    <div id="rs"></div>
    <div id="opt" hidden></div>
  </div>
  <div class="top" id="top">
    <div class="col" id="cl"></div>
    <div class="pad"><button class="u" data-p="u" aria-label="Previous entry">▲</button><button class="d" data-p="d" aria-label="Next entry">▼</button>
      <button class="l" data-p="l" aria-label="Cursor left">◀</button><button class="r" data-p="r" aria-label="Cursor right">▶</button></div>
    <div class="col" id="cr"></div>
  </div>
  <div class="grid" id="fz"></div>
  <div class="grid" id="nz"></div>
</div>

<div id="md" hidden></div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const VARS = "ABCDEFXYM";
let expr = "", cur = 0, ans = 0, angle = 0, shift = false, alpha = false, hyp = false, done = false, fr = false, last = 0;
let vars = {A:0,B:0,C:0,D:0,E:0,F:0,X:0,Y:0,M:0}, hist = [], hi = -1, nf = {m:"norm", d:4}, lists = {x:"", y:""};
try{ const s = JSON.parse(localStorage.getItem("cw991")||"null"); if(s){ Object.assign(vars, s.vars); angle = s.angle|0; if(s.nf) nf = s.nf; if(s.lists) lists = s.lists; } }catch(_){}
const save = () => { try{ localStorage.setItem("cw991", JSON.stringify({vars, angle, nf, lists})); }catch(_){} };

/* ---------- Math engine (no eval) ---------- */
const FN = ["asinh","acosh","atanh","floor","round","asin","acos","atan","sinh","cosh","tanh","ceil","log2","sin","cos","tan","log","abs","ln","√","∛"];
const M = () => new Error("M"), S = () => new Error("S");
function tokenize(s){
  const t = []; let i = 0;
  while(i < s.length){
    const r = s.slice(i), m = r.match(/^(\d+\.?\d*|\.\d+)(ᴇ[+−-]?\d+)?/);
    if(m){ t.push({n: parseFloat(m[0].replace("ᴇ","e").replace("−","-"))}); i += m[0].length; continue; }
    if(r.startsWith("Ans")){ t.push({n: ans}); i += 3; continue; }
    const w = ["mod","nCr","nPr"].find(x => r.startsWith(x));
    if(w){ t.push({o: w}); i += 3; continue; }
    if(r.startsWith("rand")){ t.push({r: 1}); i += 4; continue; }
    if(r.startsWith("ʸ√")){ t.push({o: "ʸ√"}); i += 2; continue; }
    const f = FN.find(x => r.startsWith(x));
    if(f){ t.push({f}); i += f.length; continue; }
    const c = s[i];
    if(c === "π"){ t.push({n: Math.PI}); i++; continue; }
    if(c === "e"){ t.push({n: Math.E}); i++; continue; }
    if(VARS.includes(c)){ t.push({n: vars[c]}); i++; continue; }
    if("+−×÷^()!%".includes(c)){ t.push({o: c}); i++; continue; }
    throw S();
  }
  return t;
}
const numstr = v => { if(!isFinite(v)) throw M(); return "(" + String(v).replace("e","ᴇ").replace(/-/g,"−") + ")"; };
function withX(body, x){ const o = vars.X; vars.X = x; try{ return evaluate(body); } finally{ vars.X = o; } }
function simpson(f, a, b){
  const rec = (a, b, fa, fm, fb, w, tol, d) => {
    const m = (a+b)/2, flm = f((a+m)/2), frm = f((m+b)/2);
    const l = (m-a)/6*(fa+4*flm+fm), r = (b-m)/6*(fm+4*frm+fb);
    if(d <= 0 || Math.abs(l+r-w) <= 15*tol) return l + r + (l+r-w)/15;
    return rec(a, m, fa, flm, fm, l, tol/2, d-1) + rec(m, b, fm, frm, fb, r, tol/2, d-1);
  };
  const fa = f(a), fb = f(b), fm = f((a+b)/2);
  return rec(a, b, fa, fm, fb, (b-a)/6*(fa+4*fm+fb), 1e-9, 18);
}
function calculus(s){
  for(;;){
    const m = /d\/dx\(|∫\(/.exec(s); if(!m) return s;
    const st = m.index + m[0].length; let d = 1, k = st, from = st; const a = [];
    for(; k < s.length && d; k++){
      const c = s[k];
      if(c === "(") d++; else if(c === ")") d--; else if(c === "," && d === 1){ a.push(s.slice(from, k)); from = k + 1; }
    }
    a.push(s.slice(from, d ? k : k - 1));
    let v;
    if(m[0] === "∫("){
      if(a.length !== 3) throw S();
      v = simpson(x => withX(a[0], x), evaluate(a[1]), evaluate(a[2]));
    }else{
      if(a.length !== 2) throw S();
      const x0 = evaluate(a[1]), h = 1e-3 * Math.max(1, Math.abs(x0)), f = x => withX(a[0], x);
      v = (8*(f(x0+h) - f(x0-h)) - (f(x0+2*h) - f(x0-2*h))) / (12*h);
      if(Math.abs(v) < 1e-9) v = 0;
    }
    s = s.slice(0, m.index) + numstr(v) + s.slice(k);
  }
}
function evaluate(src){
  const t = tokenize(calculus(src)); let p = 0;
  const isOp = c => t[p] && t[p].o === c;
  const kk = [Math.PI/180, 1, Math.PI/200][angle], toR = x => x*kk, fromR = x => x/kk;
  const fns = {
    sin:x=>Math.sin(toR(x)), cos:x=>Math.cos(toR(x)), tan:x=>Math.tan(toR(x)),
    asin:x=>fromR(Math.asin(x)), acos:x=>fromR(Math.acos(x)), atan:x=>fromR(Math.atan(x)),
    sinh:Math.sinh, cosh:Math.cosh, tanh:Math.tanh, asinh:Math.asinh, acosh:Math.acosh, atanh:Math.atanh,
    ln:Math.log, log:Math.log10, log2:Math.log2, "√":Math.sqrt, "∛":Math.cbrt, abs:Math.abs, floor:Math.floor, ceil:Math.ceil, round:Math.round
  };
  const int = x => { if(!Number.isInteger(x) || x < 0 || x > 170) throw M(); return x; };
  const fact = x => { int(x); let r = 1; for(let k = 2; k <= x; k++) r *= k; return r; };
  const nPr = (n, r) => { int(n); int(r); if(r > n) throw M(); let v = 1; for(let k = 0; k < r; k++) v *= n - k; return v; };
  const nCr = (n, r) => { int(n); int(r); if(r > n) throw M(); r = Math.min(r, n-r); let v = 1; for(let k = 1; k <= r; k++) v = v*(n-r+k)/k; return Math.round(v); };
  const starts = () => { const k = t[p]; return k && (k.n !== undefined || k.f || k.r || k.o === "("); };
  const expression = () => { let v = term(); while(isOp("+") || isOp("−")){ const o = t[p++].o, r = term(); v = o === "+" ? v + r : v - r; } return v; };
  function term(){
    let v = unary();
    for(;;){
      if(isOp("×")){ p++; v *= unary(); }
      else if(isOp("÷")){ p++; const d = unary(); if(d === 0) throw M(); v /= d; }
      else if(isOp("mod")){ p++; const d = unary(); if(d === 0) throw M(); v = ((v % d) + d) % d; }
      else if(isOp("nCr")){ p++; v = nCr(v, unary()); }
      else if(isOp("nPr")){ p++; v = nPr(v, unary()); }
      else if(starts()) v *= unary();
      else return v;
    }
  }
  function unary(){ if(isOp("−")){ p++; return -unary(); } if(isOp("+")){ p++; return unary(); } return power(); }
  function power(){
    let b = postfix();
    if(isOp("^")){ p++; b = Math.pow(b, unary()); }
    else if(isOp("ʸ√")){ p++; b = Math.pow(postfix(), 1/b); }
    return b;
  }
  function postfix(){ let v = primary(); while(isOp("!") || isOp("%")) v = t[p++].o === "!" ? fact(v) : v/100; return v; }
  function primary(){
    const k = t[p++];
    if(!k) throw S();
    if(k.n !== undefined) return k.n;
    if(k.r) return Math.random();
    if(k.f){ if(!starts()) throw S(); return fns[k.f](primary()); }
    if(k.o === "("){ const v = expression(); if(isOp(")")) p++; return v; }
    throw S();
  }
  const v = expression();
  if(p < t.length) throw S();
  if(!isFinite(v)) throw M();
  return v;
}
function fmt(x){
  const y = Math.abs(x); let neg = x < 0 ? "−" : "";
  if(nf.m === "fix"){ const t = y.toFixed(nf.d); return (Number(t) ? neg : "") + t; }
  if(y !== 0 && (nf.m !== "norm" || y >= 1e10 || y < 1e-9)){
    const eng = nf.m === "eng"; let e = Math.floor(Math.log10(y)); if(eng) e = Math.floor(e/3)*3;
    let m = Number((y / Math.pow(10, e)).toPrecision(10)), lim = eng ? 1000 : 10;
    if(m >= lim){ m /= lim; e += eng ? 3 : 1; }
    return neg + m + "×10^" + e;
  }
  return neg + String(Number(y.toPrecision(10)));
}
function frac(x){
  if(Number.isInteger(x)) return null;
  let h1 = 1, h0 = 0, k1 = 0, k0 = 1, y = Math.abs(x);
  for(let i = 0; i < 20; i++){
    const a = Math.floor(y), h2 = a*h1 + h0, k2 = a*k1 + k0;
    if(k2 > 1e5) return null;
    h0 = h1; h1 = h2; k0 = k1; k1 = k2;
    if(Math.abs(Math.abs(x) - h1/k1) < 1e-10*Math.max(1, Math.abs(x))) return (x < 0 ? "−" : "") + h1 + "⁄" + k1;
    if(y === a) break; y = 1/(y - a);
  }
  return null;
}

/* ---------- Editing ---------- */
const T = "asinh\\(|acosh\\(|atanh\\(|floor\\(|round\\(|asin\\(|acos\\(|atan\\(|sinh\\(|cosh\\(|tanh\\(|ceil\\(|log2\\(|d/dx\\(|sin\\(|cos\\(|tan\\(|log\\(|abs\\(|ln\\(|√\\(|∛\\(|∫\\(|Ans|nCr|nPr|mod|rand|ʸ√";
const reEnd = new RegExp("(?:" + T + ")$"), reStart = new RegExp("^(?:" + T + ")");
const OPS = ["+","−","×","÷","^","^2","^3","!","^(−1)","ʸ√","mod","nCr","nPr"];
function insert(s){
  if(done){ expr = OPS.includes(s) ? "Ans" : ""; cur = expr.length; done = false; $("rs").textContent = ""; $("rs").classList.remove("err"); }
  expr = expr.slice(0, cur) + s + expr.slice(cur); cur += s.length; hi = -1;
}
function back(){
  if(done){ done = false; }
  const l = expr.slice(0, cur), m = reEnd.exec(l), n = m ? m[0].length : (cur ? 1 : 0);
  expr = l.slice(0, cur - n) + expr.slice(cur); cur -= n;
}
function move(d){
  done = false;
  if(d < 0){ const m = reEnd.exec(expr.slice(0, cur)); cur = Math.max(0, cur - (m ? m[0].length : 1)); }
  else { const m = reStart.exec(expr.slice(cur)); cur = Math.min(expr.length, cur + (m ? m[0].length : 1)); }
}
function equals(){
  if(!expr) return;
  const rs = $("rs"); rs.classList.remove("err");
  try{
    const i = expr.lastIndexOf("→"), name = i < 0 ? null : expr.slice(i + 1);
    if(name !== null && !(name.length === 1 && VARS.includes(name))) throw S();
    const v = evaluate(i < 0 ? expr : expr.slice(0, i));
    last = v; ans = Number(v.toPrecision(15)); if(name){ vars[name] = ans; save(); }
    hist.unshift(expr); hist.length = Math.min(hist.length, 30); hi = -1;
    done = true; fr = false; rs.textContent = fmt(v);
  }catch(e){ rs.textContent = e.message === "M" ? "Math ERROR" : "Syntax ERROR"; rs.classList.add("err"); }
}
function toggleSD(){
  if(!done) return;
  fr = !fr; const f = fr ? frac(last) : null;
  if(fr && !f) fr = false;
  $("rs").textContent = f || fmt(last);
}

/* ---------- Menu: Table, Statistics, Setup ---------- */
const md = $("md"), esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tbl = {f:"X^2", a:-5, s:1, b:5};
function modal(h){ md.innerHTML = '<div class="mc">' + h + '<button class="cl" id="mx">Close</button></div>'; md.hidden = false; $("mx").onclick = () => { md.hidden = true; }; }
md.onclick = e => { if(e.target === md) md.hidden = true; };
const norm = s => s.replace(/\s+/g,"").replace(/d\/dx\(/g,"\u0001").replace(/\*/g,"×").replace(/\//g,"÷").replace(/-/g,"−").replace(/pi/gi,"π").replace(/x/g,"X").replace(/\u0001/g,"d/dx(");
function menu(){
  modal('<h3>Menu</h3><button id="m1">Table</button><button id="m2">Statistics</button><button id="m3">Setup (angle, number format)</button>');
  $("m1").onclick = tableM; $("m2").onclick = stats; $("m3").onclick = setup;
}
function setup(){
  const b = (l, on, id) => '<button id="' + id + '" class="' + (on ? "sel" : "") + '">' + l + '</button>';
  modal('<h3>Setup</h3><label>Angle unit</label><div class="row">' + ["Deg","Rad","Gra"].map((l, i) => b(l, angle === i, "an" + i)).join("") +
    '</div><label>Number format</label><div class="row">' + [["norm","Norm"],["fix","Fix"],["sci","Sci"],["eng","Eng"]].map(([k, l]) => b(l, nf.m === k, "nf" + k)).join("") + '</div>' +
    (nf.m === "fix" ? '<label>Decimal places (0–9)</label><input id="fd" type="number" min="0" max="9" value="' + nf.d + '">' : ""));
  const fin = keep => { save(); if(done && !fr) $("rs").textContent = fmt(last); draw(); if(!keep) setup(); };
  [0,1,2].forEach(i => $("an" + i).onclick = () => { angle = i; fin(); });
  ["norm","fix","sci","eng"].forEach(k => $("nf" + k).onclick = () => { nf.m = k; fin(); });
  if($("fd")) $("fd").onchange = e => { nf.d = Math.max(0, Math.min(9, parseInt(e.target.value) || 0)); fin(true); };
}
function tableM(){
  modal('<h3>Table</h3><label>f(X), for example X^2-3X+2</label><input id="tf" value="' + esc(tbl.f) + '"><div class="r3"><label>Start<input id="t1" type="number" step="any" value="' + tbl.a + '"></label><label>Step<input id="t2" type="number" step="any" value="' + tbl.s + '"></label><label>End<input id="t3" type="number" step="any" value="' + tbl.b + '"></label></div><button class="go" id="tg">Generate</button><div id="to"></div>');
  $("tg").onclick = () => {
    tbl.f = $("tf").value; tbl.a = +$("t1").value; tbl.s = +$("t2").value; tbl.b = +$("t3").value;
    const n = Math.floor((tbl.b - tbl.a) / tbl.s + 1e-9) + 1, o = $("to");
    if(!tbl.s || !(n >= 1) || n > 100){ o.textContent = "Check Start, Step and End (up to 100 rows)."; return; }
    let h = "<table><tr><td>X</td><td>f(X)</td></tr>";
    for(let i = 0; i < n; i++){
      const x = Number((tbl.a + i * tbl.s).toPrecision(12)); let y;
      try{ y = fmt(withX(norm(tbl.f), x)); }catch(_){ y = "ERROR"; }
      h += "<tr><td>" + fmt(x) + "</td><td>" + y + "</td></tr>";
    }
    o.innerHTML = h + "</table>";
  };
}
function stats(){
  modal('<h3>Statistics</h3><label>X values (commas or spaces)</label><input id="sx" value="' + esc(lists.x) + '"><label>Y values (optional, same count as X)</label><input id="sy" value="' + esc(lists.y) + '"><button class="go" id="sg">Calculate</button><div id="so"></div>');
  $("sg").onclick = () => {
    lists.x = $("sx").value; lists.y = $("sy").value; save();
    const nums = t => t.replace(/−/g,"-").split(/[\s,;]+/).map(parseFloat).filter(v => !isNaN(v));
    const x = nums(lists.x), y = nums(lists.y), out = $("so");
    if(!x.length){ out.textContent = "Enter at least one X value."; return; }
    const n = x.length, sum = a => a.reduce((p, c) => p + c, 0), mean = sum(x) / n;
    const ss = sum(x.map(v => (v - mean) ** 2)), s = x.slice().sort((p, q) => p - q);
    const med = a => { const m = a.length >> 1; return a.length % 2 ? a[m] : (a[m-1] + a[m]) / 2; };
    const lo = s.slice(0, n >> 1), hi = s.slice(Math.ceil(n / 2));
    const R = [["n", String(n)],["Σx", fmt(sum(x))],["Σx²", fmt(sum(x.map(v => v * v)))],["x̄", fmt(mean)],["σx", fmt(Math.sqrt(ss / n))],
      ["sx", n > 1 ? fmt(Math.sqrt(ss / (n - 1))) : "—"],["min", fmt(s[0])],["Q1", fmt(med(lo.length ? lo : s))],["Med", fmt(med(s))],["Q3", fmt(med(hi.length ? hi : s))],["max", fmt(s[n-1])]];
    let note = "";
    if(y.length){
      if(y.length !== n || n < 2) note = "<p>Y needs the same count as X (at least 2).</p>";
      else{
        const my = sum(y) / n, sxy = sum(x.map((v, i) => (v - mean) * (y[i] - my))), syy = sum(y.map(v => (v - my) ** 2));
        const a = ss ? sxy / ss : NaN, r = ss * syy ? sxy / Math.sqrt(ss * syy) : NaN, f = v => isFinite(v) ? fmt(v) : "—";
        R.push(["Σy", f(sum(y))],["ȳ", f(my)],["Σxy", f(sum(x.map((v, i) => v * y[i])))],["sy", f(Math.sqrt(syy / (n - 1)))],["r", f(r)],["a (slope)", f(a)],["b (intercept)", f(my - a * mean)]);
      }
    }
    out.innerHTML = note + "<table>" + R.map(r => "<tr><td>" + r[0] + "</td><td>" + r[1] + "</td></tr>").join("") + "</table>";
  };
}

const HYPABLE = ["sin(","cos(","tan(","asin(","acos(","atan("];
// [main label, action/insert, shift label, shift insert, alpha label, alpha insert, class]
const FZ = [
  ["x<sup>−1</sup>","^(−1)","x!","!"],["√","√(","∛","∛("],["x<sup>2</sup>","^2","x<sup>3</sup>","^3"],["x<sup>y</sup>","^","<sup>y</sup>√","ʸ√"],["log","log(","10<sup>x</sup>","10^("],
  ["ln","ln(","e<sup>x</sup>","e^("],["(−)","−","","","A","A"],["hyp","@hyp","","","B","B"],["sin","sin(","sin<sup>−1</sup>","asin(","C","C"],["cos","cos(","cos<sup>−1</sup>","acos(","D","D"],
  ["tan","tan(","tan<sup>−1</sup>","atan(","E","E"],["RCL","@rcl","STO","@sto","F","F"],["(","(","","","X","X"],[")",")","","","Y","Y"],["S⇔D","@sd","","","M","M"]
];
const NZ = [
  ["7","7","","","","","n"],["8","8","","","","","n"],["9","9","","","","","n"],["DEL","@del","","","","","x"],["AC","@ac","","","","","x"],
  ["4","4","d/dx","d/dx(","","","n"],["5","5","∫","∫(","","","n"],["6","6","","","","","n"],["×","×","","","","","o"],["÷","÷","","","","","o"],
  ["1","1","","","","","n"],["2","2","","","","","n"],["3","3","","","","","n"],["+","+","","","","","o"],["−","−","","","","","o"],
  ["0","0","Ran#","rand",",","",""+"n"],[".",".",",",",","","","n"],["×10<sup>x</sup>","ᴇ","π","π","e","e","n"],["Ans","Ans","","","","","o"],["=","@eq","","","","","e"]
];
NZ[15][4] = ""; NZ[16][2] = ",";
function mk(d, host){
  const b = document.createElement("button"); b.className = "k " + (d[6] || "");
  b.setAttribute("aria-label", d[0].replace(/<[^>]+>/g, ""));
  b.innerHTML = '<div class="t"><span class="s">' + (d[2] || "") + '</span><span class="a">' + (d[4] || "") + '</span></div><div class="m">' + d[0] + '</div>';
  b.onclick = () => press(d); host.append(b);
}
FZ.forEach(d => mk(d, $("fz"))); NZ.forEach(d => mk(d, $("nz")));
[["SHIFT","@shift","","","","","sk"]].forEach(d => mk(d, $("cl")));
[["ALPHA","@alpha","","","","","ak"]].forEach(d => mk(d, $("cl")));
[["OPTN","@optn"]].forEach(d => mk(d, $("cr")));
[["MENU","@menu"]].forEach(d => mk(d, $("cr")));

const OPTN = [["Abs","abs("],["Floor","floor("],["Ceil","ceil("],["Round","round("],["mod","mod"],["nCr","nCr"],["nPr","nPr"],["Ran#","rand"],["log₂","log2("],["%","%"]];
const opt = $("opt");
OPTN.forEach(([l, s]) => { const b = document.createElement("button"); b.textContent = l; b.onclick = () => { opt.hidden = true; insert(s); draw(); }; opt.append(b); });

function press(d){
  try{ navigator.vibrate && navigator.vibrate(8); }catch(_){}
  let a = d[1];
  if(a === "@shift"){ shift = !shift; alpha = false; return draw(); }
  if(a === "@alpha"){ alpha = !alpha; shift = false; return draw(); }
  if(shift && d[3]) a = d[3]; else if(alpha && d[5]) a = d[5];
  const wasShift = shift;
  shift = alpha = false; opt.hidden = true;
  if(wasShift && d[3] === "@sto"){ insert("→"); alpha = true; return draw(); }
  if(a[0] === "@"){
    if(a === "@hyp") hyp = !hyp;
    else if(a === "@rcl") alpha = true;
    else if(a === "@sto"){ insert("→"); alpha = true; }
    else if(a === "@sd") toggleSD();
    else if(a === "@del") back();
    else if(a === "@ac"){ expr = ""; cur = 0; done = false; hyp = false; hi = -1; $("rs").textContent = ""; $("rs").classList.remove("err"); }
    else if(a === "@eq") equals();
    else if(a === "@optn"){ opt.hidden = false; }
    else if(a === "@menu") menu();
    return draw();
  }
  if(hyp && HYPABLE.includes(a)){ a = a.replace("(", "h("); hyp = false; }
  insert(a); draw();
}
document.querySelectorAll("[data-p]").forEach(b => b.onclick = () => {
  const k = b.dataset.p;
  if(k === "l") move(-1); else if(k === "r") move(1);
  else if(hist.length){
    hi = k === "u" ? Math.min(hi + 1, hist.length - 1) : hi - 1;
    expr = hi < 0 ? "" : hist[hi]; cur = expr.length; done = false; $("rs").textContent = ""; $("rs").classList.remove("err");
    if(hi < 0) hi = -1;
  }
  draw();
});

function draw(){
  const ex = $("ex"); ex.textContent = "";
  if(done) ex.textContent = expr;
  else{
    ex.append(document.createTextNode(expr.slice(0, cur)));
    const c = document.createElement("span"); c.className = "cur"; ex.append(c, document.createTextNode(expr.slice(cur)));
    try{ c.scrollIntoView({block: "nearest"}); }catch(_){}
  }
  $("sS").classList.toggle("on", shift); $("sA").classList.toggle("on", alpha); $("sH").classList.toggle("on", hyp);
  $("sU").textContent = ["Deg","Rad","Gra"][angle] + (nf.m === "norm" ? "" : " " + nf.m[0].toUpperCase() + nf.m.slice(1) + (nf.m === "fix" ? nf.d : ""));
  $("body").classList.toggle("sh", shift); $("body").classList.toggle("al", alpha);
}
addEventListener("keydown", e => {
  if(!md.hidden) return;
  const k = e.key;
  if(/^[0-9.+()^!%]$/.test(k)) insert(k); else if(k === "-") insert("−"); else if(k === "*") insert("×");
  else if(k === "/"){ e.preventDefault(); insert("÷"); } else if(k === "Enter" || k === "="){ e.preventDefault(); equals(); }
  else if(k === "Backspace") back(); else if(k === "ArrowLeft") move(-1); else if(k === "ArrowRight") move(1); else return;
  draw();
});
draw();
